<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>주소 찾기</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,height=device-height,initial-scale=1.0"
    />
  </head>
  <body onload="execDaumPostcode()">
    <div
      id="layer"
      style="display:block; position:absolute; overflow:hidden; z-index:1; -webkit-overflow-scrolling:touch;"
    ></div>
    <script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
      window.addEventListener("message", onReceivedPostMessage, false);

      function onReceivedPostMessage(event) {
        var action = event.data.action;
        var params = event.data.params;
      }

      function onReceivedActivityMessageViaJavascriptInterface(json) {
        var data = JSON.parse(json);
        var action = data.action;
        var params = data.params;
      }

      function postMessage(roadAddress) {
        if (window.Android) {
          window.Android.callBackHandler(roadAddress);
        } else if (window.webkit && window.webkit.messageHandlers) {
          window.webkit.messageHandlers.callBackHandler.postMessage(roadAddress);
        }
      }

      var element_layer = document.getElementById("layer");

      function execDaumPostcode() {
        new daum.Postcode({
          oncomplete: function (data) {
            postMessage(data.roadAddress);
          },
          width: "100%",
          height: "100%",
        }).embed(element_layer);
        element_layer.style.display = "block";
        initLayerPosition();
      }

      function initLayerPosition() {
        var width = window.innerWidth || document.documentElement.clientWidth;
        var height = window.innerHeight || document.documentElement.clientHeight;
        element_layer.style.width = width + "px";
        element_layer.style.height = height + "px";
        element_layer.style.left =
          ((window.innerWidth || document.documentElement.clientWidth) - width) / 2 + "px";
        element_layer.style.top =
          ((window.innerHeight || document.documentElement.clientHeight) - height) / 2 + "px";
      }
    </script>
  </body>
</html>
