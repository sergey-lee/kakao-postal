<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>주소 찾기</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1.0"/>
  </head>

  <body onload="execDaumPostcode()">
    <div
      id="layer"
      style="display:block; position:absolute; overflow:hidden; z-index:1; -webkit-overflow-scrolling:touch;"
    ></div>

    <script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <script>
      var element_layer = document.getElementById("layer");

      // 🔥 Универсальная отправка
      function sendToApp(postData) {
        try {
          // Android
          if (window.Android && window.Android.callBackHandler) {
            window.Android.callBackHandler(JSON.stringify(postData));
          }
          // iOS
          else if (window.webkit && window.webkit.messageHandlers) {
            window.webkit.messageHandlers.callBackHandler.postMessage(postData);
          }
          // fallback (web/debug)
          else {
            console.log("PostData:", postData);
          }
        } catch (e) {
          console.error("sendToApp error:", e);
        }
      }

      function execDaumPostcode() {
        new daum.Postcode({
          oncomplete: function (data) {
            var jibunAddress = "";

            if (data.jibunAddress === "") {
              jibunAddress = data.autoJibunAddress;
            } else if (data.autoJibunAddress === "") {
              jibunAddress = data.jibunAddress;
            }

            // 🔥 полный объект
            var fullData = {
              roadAddress: data.roadAddress,
              jibunAddress: jibunAddress,
              zonecode: data.zonecode,
              bname: data.bname,
              buildingName: data.buildingName,
              apartment: data.apartment
            };

            // 🔥 отправляем ВСЕГДА полный объект
            sendToApp(fullData);

            // 🔥 если вдруг нужен "старый режим" (только строка)
            // можно раскомментировать:
            // sendToApp(data.roadAddress);
          },
          width: "100%",
          height: "100%",
        }).embed(element_layer);

        element_layer.style.display = "block";
        initLayerPosition();
      }

      function initLayerPosition() {
        var width = window.innerWidth || document.documentElement.clientWidth;
        var height = window.innerHeight || document.documentElement.clientHeight;

        element_layer.style.width = width + "px";
        element_layer.style.height = height + "px";
        element_layer.style.left = "0px";
        element_layer.style.top = "0px";
      }
    </script>
  </body>
</html>
